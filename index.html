<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nick Stock — Gembani</title>
  <link rel="canonical" href="https://www.gembani.com/fr/">
  <script>
    // French is the main site; browsers whose first language is English and
    // that do not accept French get the short English page.
    (function () {
      var languages = navigator.languages || [navigator.language || 'fr'];
      var english = /^en/i.test(languages[0] || '') && !languages.some(function (l) { return /^fr/i.test(l); });
      window.location.replace(english ? '/en/' : '/fr/');
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=/fr/"></noscript>
</head>
<body>
  <p><a href="/fr/">Continuer en français</a> · <a href="/en/">Continue in English</a></p>
</body>
</html>
